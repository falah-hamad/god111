workflows:
  android-apk:
    name: Build Android APK
    max_build_duration: 60

    environment:
      java: 21
      node: 22

    scripts:
      - name: Find ZIP project
        script: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          find . -maxdepth 3 -type f -print

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in the repository."
            exit 1
          fi

          echo "ZIP file found:"
          echo "$ZIP_FILE"

          echo "$ZIP_FILE" > /tmp/project_zip

      - name: Extract project
        script: |
          ZIP_FILE=$(cat /tmp/project_zip)

          echo "Extracting:"
          echo "$ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f -print

      - name: Locate project folder
        script: |
          PROJECT_DIR=$(find project -name package.json -type f -printf '%h\n' | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            exit 1
          fi

          echo "Project folder:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > /tmp/project_dir

      - name: Install dependencies
        script: |
          PROJECT_DIR=$(cat /tmp/project_dir)

          cd "$PROJECT_DIR"

          npm ci

      - name: Build React
        script: |
          PROJECT_DIR=$(cat /tmp/project_dir)

          cd "$PROJECT_DIR"

          npm run build

      - name: Sync Capacitor
        script: |
          PROJECT_DIR=$(cat /tmp/project_dir)

          cd "$PROJECT_DIR"

          npx cap sync android

      - name: Build Android APK
        script: |
          PROJECT_DIR=$(cat /tmp/project_dir)

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew assembleDebug

    artifacts:
      - project/**/android/app/build/outputs/apk/debug/app-debug.apk
